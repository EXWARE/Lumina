<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Lumina Clock Widget</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --accent: rgba(255, 255, 255, 0.9);
      --bg: rgba(0, 0, 0, 0.3);
      --border: rgba(255, 255, 255, 0.1);
    }
    body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }
    
    .widget-container {
      background: var(--bg);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 30px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.1);
      transition: background 0.3s, border-color 0.3s;
      -webkit-app-region: drag; /* Makes the whole widget draggable */
      position: relative;
      cursor: grab;
      user-select: none;
    }
    
    .widget-container:active {
      cursor: grabbing;
      background: rgba(0, 0, 0, 0.4);
    }
    
    .time {
      font-size: 5rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1;
      text-shadow: 0 2px 10px rgba(0,0,0,0.3);
      letter-spacing: -2px;
      margin-bottom: 5px;
    }
    
    .date {
      font-size: 1.2rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    
    /* Subtle hover effect to show it's draggable */
    .drag-indicator {
      position: absolute;
      top: 10px;
      opacity: 0;
      transition: opacity 0.3s;
      display: flex;
      gap: 3px;
    }
    
    .drag-indicator span {
      width: 4px;
      height: 4px;
      border-radius: 50%;
      background: rgba(255,255,255,0.4);
    }
    
    .widget-container:hover .drag-indicator {
      opacity: 1;
    }
  </style>
</head>
<body>

  <div class="widget-container">
    <div class="drag-indicator">
      <span></span><span></span><span></span>
    </div>
    <div class="time" id="time">00:00</div>
    <div class="date" id="date">LOADING...</div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    
    const timeEl = document.getElementById('time');
    const dateEl = document.getElementById('date');

    function updateClock() {
      const now = new Date();
      
      let hours = now.getHours();
      let minutes = now.getMinutes();
      
      // Formatting
      hours = hours < 10 ? '0' + hours : hours;
      minutes = minutes < 10 ? '0' + minutes : minutes;
      
      timeEl.textContent = `${hours}:${minutes}`;
      
      const options = { weekday: 'long', month: 'long', day: 'numeric' };
      dateEl.textContent = now.toLocaleDateString('en-US', options);
    }

    // Initial call
    updateClock();
    
    // Update every second
    setInterval(updateClock, 1000);
    
    // Report drag end to main process to save bounds
    let dragTimeout;
    window.addEventListener('mouseup', () => {
        clearTimeout(dragTimeout);
        dragTimeout = setTimeout(() => {
            const bounds = {
                x: window.screenX,
                y: window.screenY,
                width: window.outerWidth,
                height: window.outerHeight
            };
            ipcRenderer.send('widget-dragged', 'clock', bounds);
        }, 500);
    });
  </script>
</body>
</html>
